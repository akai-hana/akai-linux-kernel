# Build configuration for the 7.2.15 kernel.
# This file is sourced by scripts/build.sh. Paths are relative to the
# repository root unless they start with "/".

KERNEL_VERSION="7.2.15"

# Toolchain used by the recorded configs (CONFIG_CC_IS_CLANG=y).
# "llvm" passes LLVM=1 to make; "gcc" passes CC=gcc.
COMPILER="llvm"

# Default configuration. Select another with:
#   ./build.sh --config 7.2.15/configs/config-7.2.15-eudaimonia-01
DEFAULT_CONFIG="7.2.15/configs/config-7.2.15-eudaimonia-04"

# Upstream stable tree and tag. The combined patch in patches/ is relative
# to this exact tag.
KERNEL_GIT_URL="https://git.kernel.org/pub/scm/linux/kernel/git/stable/linux.git"
KERNEL_GIT_REF="v7.2.15"

# Exact applied change set: linux-tkg 7.2 selections plus local preempt and
# BBR3 patches. Includes new files, so it is not just "git diff" of tracked
# files.
KERNEL_PATCH="7.2.15/patches/0001-linux-tkg-and-local.patch"

# LenovoLegionLinux out-of-tree module.
LEGION_GIT_URL="https://github.com/johnfanv2/LenovoLegionLinux.git"
LEGION_GIT_REF="7c19579d13ce686cf1e237699b9a78e80d03c977"
LEGION_PATCH="7.2.15/patches/legion/0001-lenovo-legion-makefile-uname.patch"

# OpenZFS/SPL version built against the new kernel through ckms.
ZFS_VERSION="2.4.4"

# Empty means nproc.
JOBS=""
